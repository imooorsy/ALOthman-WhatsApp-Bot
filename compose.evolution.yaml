name: osman-whatsapp
services:
  evolution:
    image: evoapicloud/evolution-api:v2.3.8
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    env_file: .local/evolution.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - instances:/evolution/instances
      - ./.local/certs:/evolution/local-certs:ro
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080', {signal: AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      start_period: 120s
      retries: 12
  postgres:
    image: postgres:16
    restart: unless-stopped
    env_file: .local/evolution.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - database:/var/lib/postgresql/data
volumes:
  instances:
  database:
