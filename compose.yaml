services:
  db:
    image: postgres:16-alpine
    ports: ["54329:5432"]
    environment:
      POSTGRES_USER: osman
      POSTGRES_PASSWORD: osman_local
      POSTGRES_DB: osman
    volumes: ["osman_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U osman"]
      interval: 5s
      retries: 10
volumes:
  osman_pg:
